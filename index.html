<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  quiz.html — 형성평가 쉘 (schemaVersion 1, template "quiz")
  이 파일은 4개 콘텐츠 쉘(quiz/speed/pair/order) 중 공통 계약의 원본이다.
  아래 "공통 계약" 표시가 붙은 JS/CSS 블록은 다른 쉘이 그대로 복제한다.

  사용법: 이 파일을 복사한 뒤 아래 id="config" 스크립트 블록(JSON) 내용만 교체한다.
  엔진(CSS/JS)은 건드리지 않는다.

  CONFIG 스키마:
  {
    "schemaVersion": 1,              // 고정값, 반드시 1
    "template": "quiz",              // 고정값, 반드시 "quiz"
    "title": "문자열",                 // 필수, 화면 상단 제목
    "subtitle": "문자열",              // 선택, 제목 아래 부제
    "theme": "indigo|pink|green|violet|teal|amber",  // 필수, 6종 중 하나
    "credit": {                      // 필수
      "mode": "anonymous|named",     // anonymous: 무기명 / named: 이름·학교 표기
      "name": "문자열",                // mode가 named일 때만 사용
      "school": "문자열"               // mode가 named일 때만 사용
    },
    "shuffle": { "questions": true, "choices": true },  // 선택, 기본값 false/false
    "records": true,                 // 선택, 기본값 false. true면 결과 화면에 "내 기록"
                                      // (localStorage 기반 이 기기의 개인 기록) 섹션을 표시.
                                      // boolean이 아니거나 없으면 꺼진 것으로 취급(하위 호환).
    "questions": [                   // 필수, 1개 이상
      // choice(객관식)
      {
        "type": "choice",
        "prompt": "문자열",
        "choices": ["문자열", "..."],           // 2개 이상 권장
        "answerIndex": 0,                       // choices 인덱스 (정수, 범위 내)
        "feedbacks": ["문자열", "..."],          // choices와 길이 동일. 오답 선택 시 표시.
                                                 // 빈 문자열("")이면 explanation으로 대체.
        "explanation": "문자열"                  // 선택, 정답 해설
      },
      // short(단답형)
      {
        "type": "short",
        "prompt": "문자열",
        "answer": "문자열",             // 필수, 정답(빈 문자열 불가)
        "aliases": ["문자열", "..."],   // 선택, 정답으로 함께 인정할 표현
        "explanation": "문자열"         // 선택
      },
      // ox(참/거짓)
      {
        "type": "ox",
        "prompt": "문자열",
        "answer": true,                 // 필수, boolean (true=○, false=×)
        "explanation": "문자열"         // 선택
      }
    ]
  }

  이스케이프 규칙: 위 script#config 블록은 <script> 태그이므로, 브라우저 HTML 파서는
  이 블록 안에서도 "</script" 로 시작하는 문자열을 만나면 태그를 즉시 조기 종료시킨다.
  따라서 CONFIG의 어떤 문자열 값에 "</" 시퀀스가 들어가면 반드시 "<\/" 로 이스케이프해서
  적는다. 예: prompt에 "a</b>" 를 쓰고 싶다면 "a<\/b>" 로 적을 것.
  (아래 예시의 <sup>2</sup> 처럼 "sup"·"sub" 태그는 "script"로 시작하지 않아 안전하지만,
  안전을 위해 CONFIG를 새로 작성할 때는 "</" 가 보이면 습관적으로 "<\/" 로 바꿔 적는다.)

  렌더링 규칙: 모든 CONFIG 문자열은 renderText()로 escape 후 &lt;sup&gt;/&lt;sub&gt;
  태그만 화이트리스트로 되돌려 <sup>/<sub>(제곱·아래첨자 표기)만 허용한다.
-->
<title>형성평가</title>
<style>
  /* ===== 공통 계약: 기본 리셋 · 폰트 · 레이아웃 (모든 쉘 동일) ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f8fafc;
    color: #1f2937;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ===== 공통 계약: 테마 프리셋 CSS 변수 6종 (모든 쉘 동일) ===== */
  body.theme-indigo { --primary:#4f46e5; --primary-light:#eef2ff; --primary-dark:#4338ca; }
  body.theme-pink   { --primary:#db2777; --primary-light:#fdf2f8; --primary-dark:#be185d; }
  body.theme-green  { --primary:#16a34a; --primary-light:#f0fdf4; --primary-dark:#15803d; }
  body.theme-violet { --primary:#7c3aed; --primary-light:#f5f3ff; --primary-dark:#6d28d9; }
  body.theme-teal   { --primary:#0d9488; --primary-light:#f0fdfa; --primary-dark:#0f766e; }
  body.theme-amber  { --primary:#d97706; --primary-light:#fffbeb; --primary-dark:#b45309; }

  /* ===== 공통 계약: 에러 카드 (showError가 사용, 모든 쉘 동일) ===== */
  .error-card {
    max-width: 480px;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .error-icon { font-size: 32px; margin-bottom: 12px; }
  .error-msg { color: #374151; font-size: 15px; white-space: pre-wrap; word-break: break-word; margin: 0; }

  /* ===== 공통 계약: credit 푸터 (모든 쉘 동일) ===== */
  .credit { text-align: center; font-size: 12px; color: #6b7280; margin-top: 24px; }

  /* ===== quiz 전용 스타일 ===== */
  .app-header { text-align: center; margin-bottom: 16px; }
  .app-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; word-break: keep-all; }
  .app-subtitle { font-size: 14px; color: #6b7280; margin: 0; word-break: keep-all; }

  .progress-wrap { margin-bottom: 16px; }
  .progress-bar { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--primary); height: 100%; transition: width .25s ease; }
  .progress-label { text-align: right; font-size: 12px; color: #6b7280; margin-top: 4px; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    margin-bottom: 16px;
  }
  .prompt { font-size: 17px; font-weight: 600; margin: 0 0 16px; word-break: keep-all; overflow-wrap: break-word; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; min-height: 48px; padding: 12px 16px;
    border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; color: #1f2937;
    font-size: 15px; text-align: left; cursor: pointer;
    font-family: inherit;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .choice-btn:not(:disabled):hover { border-color: var(--primary); }
  .choice-btn:not(:disabled):active { background: var(--primary-light); }
  .choice-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #16a34a; font-weight: 700; }
  .choice-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; font-weight: 700; }
  .choice-btn.disabled { opacity: .5; }
  .choice-btn:disabled { cursor: default; }
  .ans-icon { font-weight: 700; }
  .choice-text { flex: 1; }

  .ox-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ox-btn {
    min-height: 64px; border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; font-size: 28px; font-weight: 700; color: #1f2937;
    cursor: pointer; font-family: inherit;
  }
  .ox-btn:not(:disabled):hover { border-color: var(--primary); }
  .ox-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #16a34a; }
  .ox-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
  .ox-btn.disabled { opacity: .5; }
  .ox-btn:disabled { cursor: default; }

  .short-area { display: flex; gap: 8px; flex-wrap: wrap; }
  .short-input {
    flex: 1; min-width: 120px; min-height: 44px; padding: 10px 14px;
    border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px;
    font-family: inherit; color: #1f2937;
  }
  .short-input:focus { outline: none; border-color: var(--primary); }
  .short-input:disabled { background: #f3f4f6; color: #6b7280; }

  .btn-primary {
    display: block; width: 100%; min-height: 48px;
    background: var(--primary); color: #ffffff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    padding: 12px 16px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .short-submit { width: auto; padding: 12px 20px; min-height: 44px; }

  .feedback { display: flex; gap: 10px; margin-top: 16px; padding: 14px; border-radius: 12px; align-items: flex-start; }
  .feedback.correct { background: #f0fdf4; }
  .feedback.wrong { background: #fef2f2; }
  .fb-icon { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .fb-body { flex: 1; min-width: 0; }
  .feedback.correct .fb-icon { color: #16a34a; }
  .feedback.wrong .fb-icon { color: #dc2626; }
  .fb-head { margin: 0 0 4px; font-weight: 700; }
  .feedback.correct .fb-head { color: #16a34a; }
  .feedback.wrong .fb-head { color: #dc2626; }
  .fb-detail { margin: 4px 0 0; font-size: 14px; color: #1f2937; word-break: keep-all; overflow-wrap: break-word; }

  .result-card { text-align: center; }
  .result-score { font-size: 36px; font-weight: 800; color: var(--primary); }
  .result-sub { color: #6b7280; margin-top: 6px; }

  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .review-item { display: flex; gap: 10px; background: #ffffff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .review-num {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: #fef2f2; color: #dc2626; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .review-body { flex: 1; min-width: 0; }
  .review-prompt { margin: 0 0 4px; font-weight: 600; word-break: keep-all; overflow-wrap: break-word; }
  .review-explain { margin: 0; font-size: 14px; color: #6b7280; word-break: keep-all; overflow-wrap: break-word; }

  .btn-retry { margin-bottom: 16px; }

  /* ===== quiz 전용: 내 기록(localStorage) 스타일 ===== */
  .records-section { text-align: left; }
  .records-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; word-break: keep-all; overflow-wrap: break-word; }
  .records-newbest {
    display: flex; align-items: center; gap: 6px;
    margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
    background: var(--primary-light); color: var(--primary-dark);
    font-weight: 700; font-size: 14px;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .records-best { margin: 0 0 12px; font-size: 14px; color: #374151; word-break: keep-all; overflow-wrap: break-word; }
  .records-best strong { color: var(--primary); font-size: 18px; }
  .records-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .records-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 10px; background: #f8fafc; border-radius: 8px;
    font-size: 13px; color: #374151;
  }
  .records-item-score { font-weight: 700; }
  .records-item-time { color: #6b7280; font-size: 12px; flex: none; }
  .records-note { margin: 0; font-size: 12px; color: #6b7280; word-break: keep-all; overflow-wrap: break-word; }
</style>
</head>

<div id="app"></div>

  "credit": { "mode": "anonymous", "name": "", "school": "" },

      "explanation": "24의 약수는 1, 2, 3, 4, 6, 8, 12, 24이고 36의 약수는 1, 2, 3, 4, 6, 9, 12, 18, 36이에요. 공통으로 들어 있는 수 중 가장 큰 것은 12입니다."

<script>
(function () {
  "use strict";

  /* ===== 공통 계약 (모든 쉘 동일) — Task 3~5가 이 블록을 그대로 복제한다 ===== */

  function getConfig() {
    var parsed;
    try {
      parsed = JSON.parse(document.getElementById('config').textContent);
    } catch (e) {
      showError('CONFIG 오류: JSON 문법 — ' + e.message);
      return null;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      showError('CONFIG 오류: CONFIG는 JSON 객체({ ... })여야 합니다. 현재 값의 타입을 확인해 주세요.');
      return null;
    }
    return parsed;
  }

  function showError(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="error-card"><div class="error-icon">⚠️</div><p class="error-msg"></p></div>';
    app.querySelector('.error-msg').textContent = msg;
  }

  function validateCommon(cfg) {
    if (cfg.schemaVersion !== 1) {
      showError('CONFIG 오류: schemaVersion이 1이 아닙니다.');
      return false;
    }
    if (cfg.template !== 'quiz') {
      showError('CONFIG 오류: template이 "quiz"가 아닙니다.');
      return false;
    }
    if (typeof cfg.title !== 'string' || cfg.title.length === 0) {
      showError('CONFIG 오류: title이 없거나 빈 문자열입니다.');
      return false;
    }
    if (['indigo', 'pink', 'green', 'violet', 'teal', 'amber'].indexOf(cfg.theme) === -1) {
      showError('CONFIG 오류: theme 값이 올바르지 않습니다. (indigo/pink/green/violet/teal/amber 중 하나)');
      return false;
    }
    if (!cfg.credit || ['anonymous', 'named'].indexOf(cfg.credit.mode) === -1) {
      showError('CONFIG 오류: credit.mode 값이 올바르지 않습니다. (anonymous/named 중 하나)');
      return false;
    }
    return true;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(s) {
    return escapeHtml(s)
      .replace(/&lt;sup&gt;/g, '<sup>')
      .replace(/&lt;\/sup&gt;/g, '</sup>')
      .replace(/&lt;sub&gt;/g, '<sub>')
      .replace(/&lt;\/sub&gt;/g, '</sub>');
  }

  function applyTheme(cfg) {
    document.body.classList.add('theme-' + cfg.theme);
  }

  function creditFooterHtml(cfg) {
    var c = cfg.credit;
    var text;
    if (c.mode === 'anonymous') {
      text = '2026 에듀플러스위크 미래교육박람회에서 제작';
    } else {
      text = renderText(c.name || '') + ' 선생님 (' + renderText(c.school || '') + ') · 2026 에듀플러스위크 미래교육박람회';
    }
    return '<footer class="credit">' + text + '</footer>';
  }

  function headerHtml(cfg) {
    var sub = cfg.subtitle ? '<p class="app-subtitle">' + renderText(cfg.subtitle) + '</p>' : '';
    return '<header class="app-header"><h1 class="app-title">' + renderText(cfg.title) + '</h1>' + sub + '</header>';
  }

  /* ===== 공통 계약 끝 ===== */

  /* ===== quiz 전용: 검증 ===== */

  function validateQuiz(cfg) {
    if (!Array.isArray(cfg.questions) || cfg.questions.length === 0) {
      showError('CONFIG 오류: questions 배열이 비어있습니다.');
      return false;
    }
    for (var i = 0; i < cfg.questions.length; i++) {
      var q = cfg.questions[i];
      var n = i + 1;
      if (!q || ['choice', 'short', 'ox'].indexOf(q.type) === -1) {
        showError('CONFIG 오류: ' + n + '번 문항의 type이 올바르지 않습니다. (choice/short/ox 중 하나)');
        return false;
      }
      if (q.type === 'choice') {
        if (!Array.isArray(q.choices) || q.choices.length === 0) {
          showError('CONFIG 오류: ' + n + '번 문항의 choices가 배열이 아니거나 비어있습니다.');
          return false;
        }
        if (!Number.isInteger(q.answerIndex) || q.answerIndex < 0 || q.answerIndex >= q.choices.length) {
          showError('CONFIG 오류: ' + n + '번 문항의 answerIndex가 choices 범위를 벗어났습니다.');
          return false;
        }
        if (!Array.isArray(q.feedbacks) || q.feedbacks.length !== q.choices.length) {
          showError('CONFIG 오류: ' + n + '번 문항의 feedbacks 길이가 choices와 일치하지 않습니다.');
          return false;
        }
      } else if (q.type === 'short') {
        if (typeof q.answer !== 'string' || q.answer.length === 0) {
          showError('CONFIG 오류: ' + n + '번 문항(단답형)의 answer가 없거나 빈 문자열입니다.');
          return false;
        }
      } else if (q.type === 'ox') {
        if (typeof q.answer !== 'boolean') {
          showError('CONFIG 오류: ' + n + '번 문항(OX)의 answer가 true/false가 아닙니다.');
          return false;
        }
      }
    }
    return true;
  }

  /* ===== quiz 전용: 셔플 · 채점 헬퍼 ===== */

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildRunQuestions(cfg) {
    var shuffleQ = !!(cfg.shuffle && cfg.shuffle.questions);
    var shuffleC = !!(cfg.shuffle && cfg.shuffle.choices);
    var list = cfg.questions.map(function (q) {
      if (q.type !== 'choice') return q;
      var bundle = q.choices.map(function (text, i) {
        return { text: text, feedback: q.feedbacks[i], correct: i === q.answerIndex };
      });
      if (shuffleC) bundle = shuffleArray(bundle);
      return {
        type: 'choice',
        prompt: q.prompt,
        choices: bundle.map(function (b) { return b.text; }),
        feedbacks: bundle.map(function (b) { return b.feedback; }),
        answerIndex: bundle.findIndex(function (b) { return b.correct; }),
        explanation: q.explanation
      };
    });
    if (shuffleQ) list = shuffleArray(list);
    return list;
  }

  function normalizeShort(s) {
    return String(s).trim().replace(/\s+/g, '').toLowerCase();
  }

  function checkShortAnswer(q, userInput) {
    var norm = normalizeShort(userInput);
    var candidates = [q.answer].concat(Array.isArray(q.aliases) ? q.aliases : []);
    return candidates.some(function (c) { return normalizeShort(c) === norm; });
  }

  /* ===== quiz 전용: 내 기록(localStorage) ===== */
  /* CONFIG.records가 true일 때만 동작. localStorage 접근은 전부 try/catch로 감싸
     file://·프라이빗 모드 등에서 예외가 나도 퀴즈 진행에는 전혀 영향이 없게 한다. */

  function recordsEnabled(cfg) {
    return cfg.records === true;
  }

  function recordsStorageKey(cfg) {
    return 'booth:' + cfg.template + ':' + cfg.title;
  }

  function formatRecordTime(ts) {
    var d = new Date(ts);
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 결과 화면 진입 시 1회 호출. 이번 점수를 저장하고, 이전 기록이 있었을 때만
  // "내 기록" 섹션 HTML을 반환한다(첫 판이거나 localStorage 사용 불가 시 빈 문자열).
  // 저장 형식: { n: 지금까지 푼 총 횟수, items: [최근 20회] }
  // (리허설 중 쌓였을 수 있는 예전 배열 형식도 그대로 읽는다)
  function buildRecordsSectionHtml(cfg, score, total) {
    var key = recordsStorageKey(cfg);
    var prior, priorCount;
    try {
      var raw = localStorage.getItem(key);
      var parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed)) {
        prior = parsed; priorCount = parsed.length;
      } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.items)) {
        prior = parsed.items;
        priorCount = typeof parsed.n === 'number' ? parsed.n : parsed.items.length;
      } else {
        prior = []; priorCount = 0;
      }
    } catch (e) {
      return '';
    }
    var entry = { score: score, total: total, at: Date.now() };
    var count = priorCount + 1;
    var updated = prior.concat([entry]);
    if (updated.length > 20) updated = updated.slice(updated.length - 20);
    try { localStorage.setItem(key, JSON.stringify({ n: count, items: updated })); } catch (e) { /* 조용히 무시, 화면 표시는 계속 */ }
    if (priorCount === 0) return '';   // 첫 판에는 표시하지 않는다
    var maxPriorScore = prior.reduce(function (m, r) { return Math.max(m, r.score); }, -Infinity);
    var isNewBest = entry.score > maxPriorScore;
    var bestEntry = updated.reduce(function (b, r) { return r.score > b.score ? r : b; }, updated[0]);
    var recent = updated.slice(-5).reverse();
    var html = '<div class="card records-section">';
    html += '<h2 class="records-title">📈 내 기록</h2>';
    if (isNewBest) {
      html += '<p class="records-newbest">🎉 최고 기록 경신!</p>';
    }
    html += '<p class="records-best">지금까지 <strong>' + count + '번</strong> 풀었어요 · 최고 점수 <strong>'
      + bestEntry.score + ' / ' + bestEntry.total + '</strong></p>';
    html += '<ul class="records-list">' + recent.map(function (r) {
      return '<li class="records-item"><span class="records-item-score">' + r.score + ' / ' + r.total + '</span>' +
        '<span class="records-item-time">' + formatRecordTime(r.at) + '</span></li>';
    }).join('') + '</ul>';
    html += '<p class="records-note">기록은 이 기기에만 저장돼요. 다른 사람과 섞이지 않아요.</p>';
    html += '</div>';
    return html;
  }

  /* ===== quiz 전용: 상태 · 렌더링 ===== */

  var runtime = null;

  function initRuntime(cfg) {
    runtime = {
      cfg: cfg,
      questions: buildRunQuestions(cfg),
      idx: 0,
      score: 0,
      answered: false,
      selected: null,
      correct: null,
      reviews: []
    };
    renderQuestionScreen();
  }

  function progressBarHtml(idx, total) {
    var pct = Math.round((idx / total) * 100);
    return '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">' + (idx + 1) + ' / ' + total + '</div></div>';
  }

  function choiceAreaHtml(q) {
    return '<div class="choices">' + q.choices.map(function (c, i) {
      var cls = 'choice-btn';
      var icon = '';
      if (runtime.answered) {
        if (i === q.answerIndex) { cls += ' correct'; icon = '<span class="ans-icon">○</span>'; }
        else if (i === runtime.selected) { cls += ' wrong'; icon = '<span class="ans-icon">×</span>'; }
        else { cls += ' disabled'; }
      }
      return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (runtime.answered ? ' disabled' : '') + '>' +
        icon + '<span class="choice-text">' + renderText(c) + '</span></button>';
    }).join('') + '</div>';
  }

  function oxAreaHtml(q) {
    var opts = [{ v: true, label: '○' }, { v: false, label: '×' }];
    return '<div class="ox-choices">' + opts.map(function (o) {
      var cls = 'ox-btn';
      if (runtime.answered) {
        if (o.v === q.answer) cls += ' correct';
        else if (o.v === runtime.selected) cls += ' wrong';
        else cls += ' disabled';
      }
      return '<button type="button" class="' + cls + '" data-v="' + o.v + '"' + (runtime.answered ? ' disabled' : '') + '>' + o.label + '</button>';
    }).join('') + '</div>';
  }

  function shortAreaHtml() {
    var val = (runtime.answered && typeof runtime.selected === 'string') ? runtime.selected : '';
    return '<div class="short-area"><input type="text" id="shortInput" class="short-input" value="' + escapeHtml(val) + '"' +
      (runtime.answered ? ' disabled' : '') + ' placeholder="답을 입력하세요" autocomplete="off">' +
      (runtime.answered ? '' : '<button type="button" class="btn-primary short-submit" id="shortSubmitBtn">확인</button>') + '</div>';
  }

  function answerAreaHtml(q) {
    if (q.type === 'choice') return choiceAreaHtml(q);
    if (q.type === 'ox') return oxAreaHtml(q);
    return shortAreaHtml();
  }

  function feedbackHtml(q) {
    var icon = runtime.correct ? '○' : '×';
    var cls = runtime.correct ? 'feedback correct' : 'feedback wrong';
    var body;
    if (runtime.correct) {
      body = '<p class="fb-head">정답이에요!</p>';
    } else {
      var extra = [];
      if (q.type === 'choice') {
        // feedbacks[i]가 있으면 그것만, 빈 문자열이면 explanation으로 대체(브리프 명세).
        var msg = q.feedbacks[runtime.selected] || q.explanation || '';
        if (msg) extra.push(renderText(msg));
      } else if (q.type === 'short') {
        extra.push('정답: ' + renderText(q.answer));
        if (q.explanation) extra.push(renderText(q.explanation));
      } else if (q.type === 'ox') {
        extra.push('정답: ' + (q.answer ? '○' : '×'));
        if (q.explanation) extra.push(renderText(q.explanation));
      }
      body = '<p class="fb-head">아쉬워요.</p>' + extra.map(function (t) { return '<p class="fb-detail">' + t + '</p>'; }).join('');
    }
    return '<div class="' + cls + '"><span class="fb-icon">' + icon + '</span><div class="fb-body">' + body + '</div></div>';
  }

  function renderQuestionScreen() {
    var cfg = runtime.cfg;
    var q = runtime.questions[runtime.idx];
    var total = runtime.questions.length;
    var html = '';
    html += headerHtml(cfg);
    html += progressBarHtml(runtime.idx, total);
    html += '<div class="card"><p class="prompt">' + renderText(q.prompt) + '</p>' +
      '<div class="answer-area">' + answerAreaHtml(q) + '</div>' +
      (runtime.answered ? feedbackHtml(q) : '') + '</div>';
    if (runtime.answered) {
      var isLast = runtime.idx === total - 1;
      html += '<button type="button" class="btn-primary" id="nextBtn">' + (isLast ? '결과 보기' : '다음 문제') + '</button>';
    }
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    wireAnswerEvents(q);
    if (runtime.answered) {
      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }
  }

  function renderResultScreen() {
    var cfg = runtime.cfg;
    var total = runtime.questions.length;
    var html = '';
    html += headerHtml(cfg);
    html += '<div class="card result-card"><div class="result-score">' + runtime.score + ' / ' + total + '</div>' +
      '<div class="result-sub">' + (runtime.reviews.length === 0 ? '모든 문제를 맞혔어요!' : '틀린 문제를 다시 확인해 보세요.') + '</div></div>';
    if (runtime.reviews.length > 0) {
      html += '<div class="review-list">' + runtime.reviews.map(function (r, i) {
        return '<div class="review-item"><div class="review-num">' + (i + 1) + '</div>' +
          '<div class="review-body"><p class="review-prompt">' + renderText(r.prompt) + '</p>' +
          (r.explanation ? '<p class="review-explain">' + renderText(r.explanation) + '</p>' : '') +
          '</div></div>';
      }).join('') + '</div>';
    }
    if (recordsEnabled(cfg)) {
      html += buildRecordsSectionHtml(cfg, runtime.score, total);
    }
    html += '<button type="button" class="btn-primary btn-retry" id="retryBtn">다시 도전</button>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    document.getElementById('retryBtn').addEventListener('click', function () { initRuntime(cfg); });
  }

  function nextQuestion() {
    runtime.idx++;
    runtime.answered = false;
    runtime.selected = null;
    runtime.correct = null;
    if (runtime.idx >= runtime.questions.length) {
      renderResultScreen();
    } else {
      renderQuestionScreen();
    }
  }

  function grade(selected, correct, explanation, prompt) {
    runtime.selected = selected;
    runtime.answered = true;
    runtime.correct = correct;
    if (correct) {
      runtime.score++;
    } else {
      runtime.reviews.push({ prompt: prompt, explanation: explanation || '' });
    }
    renderQuestionScreen();
  }

  function wireAnswerEvents(q) {
    if (runtime.answered) return;
    if (q.type === 'choice') {
      var choiceBtns = document.querySelectorAll('.choice-btn');
      choiceBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var i = Number(btn.getAttribute('data-i'));
          grade(i, i === q.answerIndex, q.explanation, q.prompt);
        });
      });
    } else if (q.type === 'ox') {
      var oxBtns = document.querySelectorAll('.ox-btn');
      oxBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var v = btn.getAttribute('data-v') === 'true';
          grade(v, v === q.answer, q.explanation, q.prompt);
        });
      });
    } else {
      var input = document.getElementById('shortInput');
      var submitBtn = document.getElementById('shortSubmitBtn');
      var submit = function () {
        var val = input.value;
        if (val.trim() === '') return;
        grade(val, checkShortAnswer(q, val), q.explanation, q.prompt);
      };
      submitBtn.addEventListener('click', submit);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      input.focus();
    }
  }

  /* ===== 부트스트랩 ===== */

  var cfg = getConfig();
  if (cfg && validateCommon(cfg) && validateQuiz(cfg)) {
    applyTheme(cfg);
    document.title = cfg.title;
    initRuntime(cfg);
  }
})();
</script>
</body>
</html>
